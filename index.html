<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="This HTML & CSS-only challenge is a perfect project for beginners getting up to speed with HTML and CSS fundamentals, like HTML structure and the box model."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="img/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor Challenge | Blog preview card</title>
  </head>
  <body>
    <section class="blog" role="main">
      <div class="blog-box">
        <img
          src="img/illustration-article.svg"
          alt="Article Image"
          class="blog-box-img"
        />
        <p class="blog-box-tag">Learning</p>
        <p class="blog-box-date">Published 21 Dec 2023</p>
        <h1 class="blog-box-header">HTML & CSS foundations</h1>
        <p class="blog-box-text">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="blog-box-author">
          <img
            src="img/image-avatar.webp"
            alt="Avatar Image"
            class="auhtor-img"
          />
          <cite class="author-name">Greg Hooper</cite>
        </div>
      </div>
    </section>

    <footer class="footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.linkedin.com/in/hadifarbakhsh" target="_blank"
        >Hadi Farbakhsh</a
      >.
    </footer>
  </body>
</html>
